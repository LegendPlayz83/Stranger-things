<!DOCTYPE html>
<head>
    <title>Stranger Things Quiz</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo">Stranger Things Quiz</div>
    </nav>
    <main>

        <section id="start-screen" class="start">
            <h1>How well do you know Hawkins?</h1>
            <p>Let's test your Stranger Things knowledge</p>
            <button id="start-button" class="main-button">Start Quiz</button>
        </section>

        <section id="quiz-screen" class="screen-hidden">
            <p id="question-count"></p>
            <h2 id="question-text"></h2>
            <div id="options" class="options"></div>
        </section>

        <section id="result-screen" class="screen-hidden">
            <h1>Quiz Over!</h1>
            <p id="score"></p>
            <button id="restart-button" class="main-button">Restart</button>
        </section>
        
    </main>
    <footer>
        <p>Made with ❤️ by Aditya </p>
    </footer>
    <script src="script.js"></script>
</body>
</html>
